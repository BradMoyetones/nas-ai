name: nas-ai

services:

  repo:
    image: node:latest

    container_name: nas-ai-repo

    restart: unless-stopped

    working_dir: /workspace

    environment:
      DATABASE_URL: ${DATABASE_URL}
      VITE_API_URL: ${VITE_API_URL}

    volumes:
      - ./:/workspace
      - ../data/api:/app/data

    entrypoint:
      - /bin/bash
      - -lc

    command:
      - |
        set -e

        if ! command -v git >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git \
            ca-certificates \
            openssl \
            python3 \
            make \
            g++
          rm -rf /var/lib/apt/lists/*
        fi

        if ! command -v pnpm >/dev/null 2>&1; then
          npm install -g pnpm@10.12.1
        fi

        exec sleep infinity

    stdin_open: true
    tty: true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "git --version >/dev/null 2>&1 && test -d /workspace/.git"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


  api:
    image: node:latest

    container_name: nas-ai-api

    restart: unless-stopped

    working_dir: /workspace

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=512

    volumes:
      - ./:/workspace:ro
      - ../data/api:/app/data

    ports:
      - "0.0.0.0:3000:3000"

    entrypoint:
      - /bin/bash
      - -lc

    command:
      - |
        set -e

        if ! command -v pnpm >/dev/null 2>&1; then
          npm install -g pnpm@10.12.1
        fi

        exec pnpm --filter @nas/api start:prod

    networks:
      - nas-ai-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"


  web:
    image: nginx:latest

    container_name: nas-ai-web

    restart: unless-stopped

    volumes:
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro

    ports:
      - "0.0.0.0:8081:80"

    networks:
      - nas-ai-network

    healthcheck:
      test:
        [
          "CMD",
          "nginx",
          "-t"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


networks:
  nas-ai-network:
    driver: bridge