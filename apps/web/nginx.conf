server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;

        access_log off;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        try_files $uri =404;

        expires -1;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        try_files $uri =404;

        expires -1;
        add_header Cache-Control "no-cache";
    }
}